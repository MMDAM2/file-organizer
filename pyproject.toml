#:schema https://json.schemastore.org/pyproject.json
# cSpell: words pylint MMDAM havinaccount
[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[project]
name = "file-organizer"
version = "1.1.0"
description = "A file organizer that, well, organizes a folder"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "MMDAM2", email = "amirmohammadghasemi89@gmail.com" },
  { name = "havinaccount", email = "203082879+havinaccount@users.noreply.github.com" },
]
dependencies = []

[project.scripts]
projects = "projects:file_organizer"

[tool.ruff]
line-length = 100

[tool.pylint.messages_control]
disable = ["fixme", "unused-argument"]

[dependency-groups]
dev = ["pylint==4.0.7", "pytest>=9.1.1", "ruff==0.16.4"]
