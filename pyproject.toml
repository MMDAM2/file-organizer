#:schema https://json.schemastore.org/pyproject.json
# cSpell: disable
[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[project]
name = "tidyfiles"
version = "1.2.0"
description = "A file organizer that, well, organizes a folder"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "MMDAM2", email = "218409334+MMDAM2@users.noreply.github.com" },
  { name = "havinaccount", email = "203082879+havinaccount@users.noreply.github.com" },
]
dependencies = ["platformdirs>=4.0"]

[project.gui-scripts]
tidyfiles = "tidyfiles.__main__:main"

[tool.ruff]
line-length = 100

[tool.pylint.messages_control]
disable = ["fixme", "unused-argument"]

[dependency-groups]
dev = ["pylint==4.0.7", "pytest>=9.1.1", "ruff==0.16.4", "pyinstaller>=6.0"]
